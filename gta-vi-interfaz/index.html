<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#20142f">
  <title>Grand Theft Auto VI · Menú de consola</title>
  <link rel="icon" href="assets/gta-vi-logo.svg" type="image/svg+xml">
  <link rel="preload" href="assets/vice-city.webp" as="image">
  <link rel="stylesheet" href="estilos.css">
  <link rel="stylesheet" href="consola.css">
  <link rel="stylesheet" href="ajustes.css">
  <script src="catalogo.js" defer></script>
  <script src="consola.js" defer></script>
  <script src="ajustes.js" defer></script>
  <script src="interfaz.js" defer></script>
</head>
<body>
  <div class="console" id="console">
    <div class="scenery" aria-hidden="true">
      <div class="vice-sky"></div>
      <div class="vice-art"></div>
      <div class="other-scene" id="other-scene">
        <div class="other-art" id="other-art"></div>
      </div>
      <div class="shading"></div>
    </div>

    <header class="topbar">
      <nav class="sections" aria-label="Secciones de la consola">
        <button type="button" class="section-tab" data-section="games" aria-pressed="true">Juegos</button>
        <button type="button" class="section-tab" data-section="media" aria-pressed="false">Contenido multimedia</button>
      </nav>
      <div class="system-tools">
        <button type="button" class="system-button" id="search-button" aria-label="Buscar" title="Buscar (/)">
          <svg aria-hidden="true"><use href="#i-search"></use></svg>
        </button>
        <button type="button" class="system-button" id="settings-button" aria-label="Ajustes" title="Ajustes">
          <svg aria-hidden="true"><use href="#i-settings"></use></svg>
        </button>
        <button type="button" class="system-button profile-button" id="profile-button" aria-label="Perfil" title="Perfil">
          <span class="avatar avatar-lucia" id="profile-avatar"></span><span class="online-dot"></span>
        </button>
        <time id="system-clock" class="system-clock" aria-label="Hora local"></time>
      </div>
    </header>

    <main class="home">
      <section class="carousel" id="carousel" aria-label="Carrusel de juegos">
        <div class="rail-window">
          <div class="rail" id="rail" role="group" aria-label="Títulos"></div>
        </div>
        <div class="selection-meta" aria-live="polite" aria-atomic="true">
          <span class="platform-badge" id="platform-badge">PS5</span>
          <span id="selected-name">Grand Theft Auto VI</span>
          <svg class="disc-icon" id="disc-icon" aria-hidden="true"><use href="#i-disc"></use></svg>
        </div>
        <button type="button" class="rail-step previous" id="previous" aria-label="Título anterior">
          <svg aria-hidden="true"><use href="#i-left"></use></svg>
        </button>
        <button type="button" class="rail-step next" id="next" aria-label="Título siguiente">
          <svg aria-hidden="true"><use href="#i-right"></use></svg>
        </button>
      </section>

      <section class="feature" aria-labelledby="hero-title">
        <div class="feature-copy" id="feature-copy">
          <h1 class="hero-title has-logo" id="hero-title">
            <img class="hero-logo" id="hero-logo" src="assets/gta-vi-logo.svg" alt="">
            <span id="hero-name" class="sr-only">Grand Theft Auto VI</span>
          </h1>
          <p class="description" id="description">Vive la experiencia de la serie Grand Theft Auto más ambiciosa y envolvente hasta la fecha.</p>
        </div>
        <div class="actions">
          <button type="button" class="main-action glass" id="primary" aria-label="Abrir cuenta regresiva de GTA VI">
            <span id="action-label">Calculando…</span>
          </button>
          <button type="button" class="more-action glass" id="more" aria-label="Más opciones" title="Más opciones">
            <svg aria-hidden="true"><use href="#i-more"></use></svg>
          </button>
        </div>
        <button type="button" class="friends-card" id="friends-card" aria-label="Abrir Game Base">
          <span class="avatar-stack" aria-hidden="true">
            <span class="avatar avatar-astro"></span><span class="avatar avatar-ratchet"></span>
          </span>
          <span class="friends-label">Game Base</span>
          <svg class="friends-arrow" aria-hidden="true"><use href="#i-right"></use></svg>
        </button>
      </section>
    </main>
    <footer class="console-footer">
      <button type="button" id="control-center-button" class="ps-button" aria-label="Abrir centro de control (P)">
        <svg aria-hidden="true"><use href="#i-controller"></use></svg><span>Centro de control</span><kbd>P</kbd>
      </button>
      <span class="input-hints"><span>✕</span> Seleccionar <span>◯</span> Atrás</span>
    </footer>
  </div>

  <dialog id="panel" class="panel" aria-labelledby="panel-title">
    <div class="panel-inner">
      <header class="panel-heading">
        <h2 id="panel-title"></h2>
        <button type="button" class="close-button" id="close-panel" aria-label="Cerrar" title="Cerrar (Esc)">
          <svg aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
      </header>
      <div id="panel-body"></div>
    </div>
  </dialog>
  <noscript>Activa JavaScript en tu navegador para usar el menú y la cuenta regresiva.</noscript>

  <svg class="symbol-bank" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.6" cy="10.6" r="6.8"/><path d="m15.7 15.7 5 5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9.8 3.4.55-1.1h3.3l.55 1.1.38 1.62c.6.21 1.17.53 1.71.94l1.58-.5 1.21-.06 1.66 2.87-.65 1.04-1.2 1.13a8.17 8.17 0 0 1 0 1.98l1.2 1.13.65 1.04-1.66 2.87-1.21-.06-1.58-.5a7.3 7.3 0 0 1-1.71.98l-.38 1.58-.55 1.11h-3.3l-.55-1.11-.38-1.58a7.3 7.3 0 0 1-1.71-.98l-1.58.5-1.21.06-1.66-2.87.65-1.04 1.2-1.13a8.17 8.17 0 0 1 0-1.98l-1.2-1.13-.65-1.04 1.66-2.87 1.21.06 1.58.5a7.3 7.3 0 0 1 1.71-.94z"/><circle cx="12" cy="11.6" r="3.2"/></symbol>
    <symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.7"/><circle cx="12" cy="12" r="2.3"/><path d="M12 6.3a5.7 5.7 0 0 0-5.7 5.7m7.5 5.4a5.7 5.7 0 0 0 3.6-3.7"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="4.7" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19.3" cy="12" r="1.9"/></g></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 5 7 7-7 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></symbol>
    <symbol id="i-photo" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="2.5"/><circle cx="8" cy="9" r="1.2"/><path d="m4 17 5-5 4 3 3-4 5 6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6.5v6l4 2"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-9v.1"/></symbol>
    <symbol id="i-screen" viewBox="0 0 24 24"><path d="M3 9V3h6m6 0h6v6m0 6v6h-6m-6 0H3v-6"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H14v-6h-4v6H3z"/></symbol>
    <symbol id="i-controller" viewBox="0 0 24 24"><path d="M7 7h10c3 0 5 11 3 12-2 1-4-3-5-3H9c-1 0-3 4-5 3C2 18 4 7 7 7Z"/><path d="M8 10v5m-2.5-2.5h5"/><circle cx="16" cy="11" r=".7"/><circle cx="18" cy="14" r=".7"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5zM10 21h4"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 2v10M6.5 5.5a9 9 0 1 0 11 0"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21S2 15 2 8a5 5 0 0 1 10-1A5 5 0 0 1 22 8c0 7-10 13-10 13Z"/></symbol>
    <symbol id="i-network" viewBox="0 0 24 24"><path d="M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0m-11 4a6 6 0 0 1 8 0"/><circle cx="12" cy="20" r="1"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M3 9h4l6-5v16l-6-5H3Zm13-1a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6z"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-accessibility" viewBox="0 0 24 24"><circle cx="12" cy="4" r="2"/><path d="m3 8 9 2 9-2m-9 2v6m0-3-5 8m5-8 5 8"/></symbol>
    <symbol id="i-capture" viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15A9 9 0 0 1 9 4 9 9 0 1 0 20 15Z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 3h10v7a5 5 0 0 1-10 0Zm0 2H3v3a4 4 0 0 0 4 4m10-7h4v3a4 4 0 0 1-4 4m-5 3v6m-5 0h10"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2 3 6 7 1-5 5 1 8-6-4-6 4 1-8-5-5 7-1Z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m6 3 15 9-15 9Z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m13 4-8 8 8 8M5 12h16"/></symbol>
  </svg>
</body>
</html>
